# Lädt die ERA5-Tageswerte für Europa aus dem Climate Data Store - ohne PC, direkt auf GitHub.
# Manuell starten: Reiter "Actions" -> "Europa-Daten nachladen" -> "Run workflow" (geht auch am Handy).
#   Test:     nur die neuesten Monate laden und im Protokoll schauen, ob alles klappt
#   Normal:   bis zu "monate" Monate in höchstens etwa 5 Stunden. Zusätzlich startet der Lauf alle
#             6 Stunden von selbst, bis alles von 1940 bis heute da ist (ungefähr 1.000 Monate).
# Der Stand wird in einem eigenen Speicher ("europa-") abgelegt; der tägliche Lauf übernimmt ihn
# und erstellt daraus die Europa-Grafiken.
# Voraussetzung: Geheimnis CDSAPI_KEY (Settings -> Secrets and variables -> Actions) und im CDS die
# Lizenzen der Datensätze akzeptiert.

name: Europa-Daten nachladen

on:
  # Läuft von selbst alle 6 Stunden weiter, bis alles da ist; danach endet jeder Lauf nach ~1 Minute
  # ("alle Tage schon vorhanden"). Wenn alles geladen ist, kann dieser Zeitplan raus.
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur testen (die neuesten Monate)"
        type: boolean
        default: true
      monate:
        description: "Höchstens so viele Monate laden"
        default: "400"

permissions:
  contents: read

# Eigene Warteschlange und eigener Speicher ("europa-"): läuft unabhängig vom täglichen Lauf;
# der tägliche Lauf holt sich von hier den neuesten Stand
concurrency:
  group: europa
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"            # Ausgaben sofort im Protokoll zeigen
    steps:
      - name: Projekt holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Letzten Stand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: europa_daten
          key: europa-${{ github.run_id }}
          restore-keys: europa-

      # Niño 3.4 aus ERA5 (für den Reiter "Meer"): wenige kleine Anfragen, vor Europa
      - name: Niño-3.4-ERA5-Daten laden
        if: ${{ !inputs.test }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          ERA5_FOLDER: ${{ github.workspace }}/europa_daten
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          NINO_MAX_MINUTEN: "20"
        run: |
          mkdir -p europa_daten
          python skripte/ERA5_Nino34_Daten.py

      - name: Europa-Daten laden
        timeout-minutes: 300
        env:
          ERA5_FOLDER: ${{ github.workspace }}/europa_daten
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EUROPA_MAX_MONATE: ${{ inputs.test && '2' || inputs.monate || '400' }}
          EUROPA_MAX_MINUTEN: "265"
          EUROPA_MAX_OFFEN: "6"            # so viele Monats-Anfragen gleichzeitig beim CDS; sie werden gemerkt und
                                           # vom nächsten Lauf abgeholt, falls sie länger als ein Lauf warten
          EUROPA_TEIL: ${{ inputs.test && 'neu' || 'alt' }}   # nur auffüllen; die neuesten Monate holt der tägliche Lauf
        run: |
          mkdir -p europa_daten
          if [ -z "$CDSAPI_KEY" ]; then echo "Das Geheimnis CDSAPI_KEY fehlt - bitte unter Settings anlegen."; exit 1; fi
          if [ "${{ inputs.test }}" = "true" ]; then
            # Test in eigenem Ordner, damit die echten Daten nicht berührt werden
            export ERA5_FOLDER=${{ github.workspace }}/test_europa
            mkdir -p "$ERA5_FOLDER"
          fi
          python skripte/ERA5_Europa_Daten.py
          if [ "${{ inputs.test }}" = "true" ]; then
            echo "----- Ergebnis des Tests (erste Zeilen) -----"
            head -n 20 "$ERA5_FOLDER/ERA5_europa_tag.txt"
          else
            echo "Vorhandene Tage: $(($(wc -l < europa_daten/ERA5_europa_tag.txt) - 3)) von rund 31.700"
            tail -n 3 europa_daten/ERA5_europa_tag.txt
          fi

      # Stand sichern - auch wenn der Lauf zwischendurch abbricht, bleibt das Geladene erhalten
      - name: Stand sichern
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: europa_daten
          key: europa-${{ github.run_id }}

# Lädt jeden Tag um 06:00 UTC die neuesten ERA5-Tagesmittel für Europa (Land) aus dem Climate Data Store
# (skripte/Europa_Download.py). Beim ersten Lauf zusätzlich einmalig die Landmaske und das Klimamittel
# 1991-2020. Der Stand liegt in einem eigenen Speicher ("europa-"); der tägliche Lauf um 09:00 UTC
# holt ihn sich und zeichnet daraus die Europa-Grafiken.
# Manuell starten: Reiter "Actions" -> "Europa-Daten nachladen" -> "Run workflow" (geht auch am Handy).
# Voraussetzung: Geheimnis CDSAPI_KEY (Settings -> Secrets and variables -> Actions) und im CDS die
# Lizenz der Datensätze akzeptiert (ERA5 single levels und "ERA5 post-processed daily statistics").

name: Europa-Daten nachladen

on:
  schedule:
    - cron: "0 6 * * *"          # täglich 06:00 UTC - drei Stunden vor dem täglichen Lauf
  workflow_dispatch:

permissions:
  contents: read

# Eigene Warteschlange: nie zwei Downloads gleichzeitig (ECMWF: Anfragen nacheinander)
concurrency:
  group: europa
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: "1"            # Ausgaben sofort im Protokoll zeigen
    steps:
      - name: Projekt holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Letzten Stand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: europa_daten
          key: europa-${{ github.run_id }}
          restore-keys: europa-

      - name: Europa-Tageswerte laden
        timeout-minutes: 60
        env:
          ERA5_FOLDER: ${{ github.workspace }}/europa_daten
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EUROPA_START: "2026-01-01"
          EUROPA_MAX_MINUTEN: "50"         # wartet eine Anfrage länger, holt sie der nächste Lauf ab
        run: |
          mkdir -p europa_daten
          # Reste des früheren Verfahrens entfernen (die Landmaske bleibt, sie ist dieselbe)
          rm -f europa_daten/ERA5_europa_tag*.txt europa_daten/ERA5_europa_offen.json
          if [ -z "$CDSAPI_KEY" ]; then echo "Das Geheimnis CDSAPI_KEY fehlt - bitte unter Settings anlegen."; exit 1; fi
          python skripte/Europa_Download.py
          echo "----- letzte Tage -----"
          tail -n 3 europa_daten/Europa_Land_Tag.txt 2>/dev/null || true

      # Stand sichern - auch wenn der Lauf zwischendurch abbricht, bleibt das Geladene erhalten
      - name: Stand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: europa_daten
          key: europa-${{ github.run_id }}

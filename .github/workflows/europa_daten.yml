# Lädt die ERA5-Tageswerte für Europa aus dem Climate Data Store - ohne PC, direkt auf GitHub.
# Manuell starten: Reiter "Actions" -> "Europa-Daten nachladen" -> "Run workflow" (geht auch am Handy).
#   Test:     nur die 2 neuesten Monate laden und im Protokoll schauen, ob alles klappt
#   Normal:   bis zu "monate" Monate in höchstens etwa 5 Stunden; danach einfach erneut starten,
#             bis alles von 1940 bis heute da ist (ungefähr 1.000 Monate, also einige Läufe).
# Der Stand wird im gleichen Speicher abgelegt wie beim täglichen Lauf; der nächste tägliche Lauf
# erstellt daraus die Europa-Grafiken.
# Voraussetzung: Geheimnis CDSAPI_KEY (Settings -> Secrets and variables -> Actions) und im CDS die
# Lizenzen der Datensätze akzeptiert.

name: Europa-Daten nachladen

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Nur testen (die 2 neuesten Monate)"
        type: boolean
        default: true
      monate:
        description: "Höchstens so viele Monate laden"
        default: "400"

permissions:
  contents: read

# Nie gleichzeitig mit dem täglichen Lauf (beide nutzen denselben Speicher)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"            # Ausgaben sofort im Protokoll zeigen
    steps:
      - name: Projekt holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Letzten Stand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: _site/daten
          key: daten-${{ github.run_id }}
          restore-keys: daten-

      - name: Europa-Daten laden
        timeout-minutes: 300
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EUROPA_MAX_MONATE: ${{ inputs.test && '2' || inputs.monate }}
          EUROPA_MAX_MINUTEN: "290"
          EUROPA_PARALLEL: "4"
        run: |
          mkdir -p _site/daten
          if [ -z "$CDSAPI_KEY" ]; then echo "Das Geheimnis CDSAPI_KEY fehlt - bitte unter Settings anlegen."; exit 1; fi
          if [ "${{ inputs.test }}" = "true" ]; then
            # Test in eigenem Ordner, damit die echten Daten nicht berührt werden
            export ERA5_FOLDER=${{ github.workspace }}/test_europa
            mkdir -p "$ERA5_FOLDER"
          fi
          python skripte/ERA5_Europa_Daten.py
          if [ "${{ inputs.test }}" = "true" ]; then
            echo "----- Ergebnis des Tests (erste Zeilen) -----"
            head -n 20 "$ERA5_FOLDER/ERA5_europa_tag.txt"
          else
            echo "Vorhandene Tage: $(($(wc -l < _site/daten/ERA5_europa_tag.txt) - 3))"
            tail -n 3 _site/daten/ERA5_europa_tag.txt
          fi

      # Stand sichern - auch wenn der Lauf zwischendurch abbricht, bleibt das Geladene erhalten
      - name: Stand sichern
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: _site/daten
          key: daten-${{ github.run_id }}

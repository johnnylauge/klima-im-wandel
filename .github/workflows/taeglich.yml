# Erstellt jeden Tag um 09:00 UTC die Klimagrafiken (Jahr, alle Monate und Jahreszeiten, als Balken, Punkte und Linien; dazu Berkeley Earth, NOAA und HadCRUT5 ab 1850 und ein Vergleich) und veröffentlicht sie auf GitHub Pages.
# Manuell starten: Reiter "Actions" -> "Tägliche Klimagrafik" -> "Run workflow".

name: Tägliche Klimagrafik

on:
  schedule:
    - cron: "0 9 * * *"        # täglich 09:00 UTC (= 11:00 Sommerzeit / 10:00 Winterzeit)
  workflow_dispatch:            # Knopf zum manuellen Starten
  push:
    branches: [main]            # auch nach jeder Änderung an Skript oder Webseite

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Läufe gleichzeitig veröffentlichen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Daten laden und helle Grafik erstellen
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
        run: python skripte/ERA5_Jahresmittel_Balken.py

      - name: Dunkle Grafik erstellen (ohne neuen Download)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_DUNKEL: "1"
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Jahresmittel_Balken.py

      - name: Monatsgrafiken erstellen (hell)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_MONATE: alle
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Monatsmittel_Balken.py

      - name: Monatsgrafiken erstellen (dunkel)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_MONATE: alle
          ERA5_DUNKEL: "1"
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Monatsmittel_Balken.py

      - name: Jahreszeitengrafiken erstellen (hell)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_JAHRESZEITEN: alle
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Jahreszeiten_Balken.py

      - name: Jahreszeitengrafiken erstellen (dunkel)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_JAHRESZEITEN: alle
          ERA5_DUNKEL: "1"
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Jahreszeiten_Balken.py

      - name: Punktdiagramme erstellen (hell)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_PUNKTE: alle
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Tageswerte_Punkte.py

      - name: Punktdiagramme erstellen (dunkel)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_PUNKTE: alle
          ERA5_DUNKEL: "1"
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Tageswerte_Punkte.py

      - name: Liniendiagramme erstellen (hell)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_LINIEN: alle
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Mittel_Linien.py

      - name: Liniendiagramme erstellen (dunkel)
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          ERA5_LINIEN: alle
          ERA5_DUNKEL: "1"
          ERA5_OHNE_DOWNLOAD: "1"
        run: python skripte/ERA5_Mittel_Linien.py

      # Berkeley Earth (Monatswerte ab 1850). Schlägt der Download einmal fehl, läuft der Rest
      # trotzdem weiter und die ERA5-Grafiken werden veröffentlicht.
      - name: Berkeley-Earth-Grafiken erstellen (hell)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          BE_WAHL: alle
        run: python skripte/BerkeleyEarth_Grafiken.py

      - name: Berkeley-Earth-Grafiken erstellen (dunkel)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          BE_WAHL: alle
          ERA5_DUNKEL: "1"
          BE_OHNE_DOWNLOAD: "1"
        run: python skripte/BerkeleyEarth_Grafiken.py

      - name: NOAA-Grafiken erstellen (hell)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          NOAA_WAHL: alle
        run: python skripte/NOAA_Grafiken.py

      - name: NOAA-Grafiken erstellen (dunkel)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          NOAA_WAHL: alle
          ERA5_DUNKEL: "1"
          NOAA_OHNE_DOWNLOAD: "1"
        run: python skripte/NOAA_Grafiken.py

      - name: HadCRUT5-Grafiken erstellen (hell)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          HADCRUT_WAHL: alle
        run: python skripte/HadCRUT_Grafiken.py

      - name: HadCRUT5-Grafiken erstellen (dunkel)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          HADCRUT_WAHL: alle
          ERA5_DUNKEL: "1"
          HADCRUT_OHNE_DOWNLOAD: "1"
        run: python skripte/HadCRUT_Grafiken.py

      # Vergleich: liest die TXT-Dateien von ERA5, Berkeley Earth, NOAA und HadCRUT5 (kein eigener Download)
      - name: Vergleichsgrafiken erstellen (hell)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          VGL_WAHL: alle
        run: python skripte/Vergleich_Linien.py

      - name: Vergleichsgrafiken erstellen (dunkel)
        continue-on-error: true
        env:
          ERA5_FOLDER: ${{ github.workspace }}/_site/daten
          VGL_WAHL: alle
          ERA5_DUNKEL: "1"
        run: python skripte/Vergleich_Linien.py

      - name: Webseite zusammenstellen
        run: cp site/index.html _site/

      - name: Webseite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

  # Verhindert, dass GitHub den täglichen Lauf nach 60 Tagen ohne Änderung pausiert:
  # am 1. jedes Monats schreibt der geplante Lauf das Datum in wachhalten.txt.
  # (Änderungen durch diesen Bot starten keinen neuen Lauf.)
  wachhalten:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Projekt holen
        uses: actions/checkout@v6

      - name: Monatlicher Eintrag
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%d" > wachhalten.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add wachhalten.txt
            git commit -m "Monatlicher Eintrag (hält den täglichen Lauf aktiv)" || exit 0
            git push
          else
            echo "Heute kein Eintrag nötig (nur am 1. des Monats)."
          fi
